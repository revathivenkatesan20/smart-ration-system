spring.application.name=smart-ration-system
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_ration_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Revathi@04}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security
jwt.secret=${JWT_SECRET:SmartRationDistributionSystemSecretKey2024VeryLongSecureKey}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,capacitor://localhost,http://localhost}

# External Services
ai.module.url=${AI_MODULE_URL:http://localhost:5000}

# OTP
otp.debug.mode=${OTP_DEBUG_MODE:true}
msg91.auth.key=${MSG91_AUTH_KEY:505771AaQQWnsG0x9e69d0b5afP1}
msg91.sender.id=${MSG91_SENDER_ID:SMART}
msg91.template.id=${MSG91_TEMPLATE_ID:69d0b7cb0ff6ed0c1b0c2673}

# Logging
logging.level.com.ration=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
# Anti-Gravity Compression Optimization
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=2048

# Anti-Gravity: HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=SmartRationPool

# Anti-Gravity: Tomcat Thread Tuning
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=5000
